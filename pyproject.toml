[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molcrafts-molq"
version = "0.8.0"
description = "Unified job queue for local execution and HPC schedulers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Roy Kid", email = "lijichen365@gmail.com" }
]
keywords = ["job", "queue", "cluster", "slurm", "hpc", "scheduler"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "typer>=0.9",
  "rich>=14.3.3",
  "molcrafts-mollog",
  "molcrafts-molcfg>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/MolCrafts/molq"
Documentation = "https://docs.molcrafts.org/molq/"
Repository = "https://github.com/MolCrafts/molq"
Issues = "https://github.com/MolCrafts/molq/issues"

[project.scripts]
molq = "molq.cli.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-mock",
  "pytest-cov",
  "coverage[toml]",
  "build",
  # Pin tools so CI `pip install -e ".[dev]"` and local pre-commit
  # (language: system) resolve the same binaries. Bump deliberately.
  "ruff==0.15.22",
  "ty==0.0.62",
  "tox>=4.23",
]
docs = [
  "zensical>=0.0.45",
  "molcrafts-zensical-theme==0.2.3",
  "mkdocstrings[python]>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["molq*"]

[tool.setuptools.package-data]
molq = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
]

# Isolated gates — prek + CI: uv run --extra dev tox -e lint|py
[tool.tox]
requires = ["tox>=4.23"]
env_list = ["lint", "py"]

[tool.tox.env.lint]
description = "CI lint (package installed so ty resolves first-party imports)"
skip_install = false
package = "wheel"
extras = ["dev"]
base_python = ["python3.12"]
commands = [
  ["ruff", "check", "src", "tests"],
  ["ruff", "format", "--check", "src", "tests"],
  ["ty", "check", "src/"],
]

[tool.tox.env.py]
description = "CI test (non-editable package when package=wheel)"
base_python = ["python3.12"]
pass_env = [
  "HOME",
  "PATH",
  "SSH_AUTH_SOCK",
  "TERM",
  "VIRTUAL_ENV",
  "UV_*",
]
package = "wheel"
extras = ["dev"]
commands_pre = [
  [
    "{envpython}",
    "-c",
    "import pathlib, site; sps=site.getsitepackages(); print('site-packages', sps)",
  ],
]
commands = [
  [
    "{envpython}",
    "-m",
    "pytest",
    "-q",
    "--cov=molq",
    "--cov-report=term-missing",
    "--cov-report=xml",
  ],
]
