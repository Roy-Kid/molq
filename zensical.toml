[project]
site_name = "molq"
site_description = "Run local commands and HPC jobs from Python or the command line."
site_url = "https://docs.molcrafts.org/molq/"
site_author = "Roy Kid"
copyright = "Copyright &copy; 2026 MolCrafts"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/MolCrafts/molq"
repo_name = "MolCrafts/molq"
edit_uri = "edit/master/docs/"
exclude_docs = """
reviews/
spec/
"""

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "installation.md" },
    { "Quickstart" = "getting-started.md" },
    { "Jobs and clusters" = "concepts.md" },
    { "0.9.0 release notes" = "release-notes.md" },
  ] },
  { "User guide" = [
    { "Clusters" = "schedulers.md" },
    { "Submit jobs" = "jobs.md" },
    { "Follow jobs" = "monitoring.md" },
    { "Files and logs" = "remote-files.md" },
    { "GPUs and NVIDIA MPS" = "nvidia-mps.md" },
    { "Watch and notifications" = "plugins.md" },
    { "Configuration" = "configuration.md" },
  ] },
  { "API reference" = [
    { "Python API" = [
      { "Overview" = "api.md" },
      { "Client handles" = "reference/core.md" },
      { "Async handles" = "reference/async.md" },
      { "Request values" = "reference/types.md" },
    ] },
    { "TypeScript" = "reference/typescript.md" },
    { "Command line" = "cli.md" },
    { "RPC and errors" = "reference/utilities.md" },
  ] },
]

# The PyPI `molcrafts-zensical-theme` package owns brand colors, light/dark
# schemes, typography, navigation, and the home-page components used below.
# Keep those defaults in the theme instead of duplicating them in this site.
[project.theme]
name = "molcrafts"
language = "en"

# molq accent (rose) for links, hovers, and hero eyebrows.
[project.extra.molcrafts]
product = "molq"
accent = "#db2777"                        # primary (主) — molq signature colour
accent_soft = "rgba(219, 39, 119, 0.14)"  # secondary (副) — soft fill behind it

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MolCrafts/molq"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/molcrafts-molq/"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx]
details = {}
inlinehilite = {}
highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
tabbed = { alternate_style = true, combine_header_slug = true }
superfences = {}

[project.plugins.search]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_root_full_path = false
separate_signature = true
heading_level = 3
merge_init_into_class = true
members_order = "source"
filters = ["!^_"]
