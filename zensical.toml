[project]
site_name = "molq"
site_description = "One Python interface for local commands and HPC schedulers."
site_url = "https://docs.molcrafts.org/molq/"
site_author = "Roy Kid"
copyright = "Copyright &copy; 2026 MolCrafts"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/MolCrafts/molq"
repo_name = "MolCrafts/molq"
edit_uri = "edit/master/docs/"

nav = [
  { "Home" = "index.md" },
  { "Start here" = [
    { "Quickstart" = "getting-started.md" },
    { "Mental model" = "concepts.md" },
  ] },
  { "Guides" = [
    { "Submit jobs" = "jobs.md" },
    { "Clusters & schedulers" = "schedulers.md" },
    { "Monitor jobs" = "monitoring.md" },
    { "Remote files" = "remote-files.md" },
    { "Command line" = "cli.md" },
    { "Plugins & Nerve" = "plugins.md" },
  ] },
  { "Reference" = [
    { "Configuration" = "configuration.md" },
    { "Python API" = [
      { "Overview" = "api.md" },
      { "Core API" = "reference/core.md" },
      { "Job types" = "reference/types.md" },
      { "Supporting APIs" = "reference/utilities.md" },
    ] },
  ] },
]

# The PyPI `molcrafts-zensical-theme` package owns brand colors, light/dark
# schemes, typography, navigation, and the home-page components used below.
# Keep those defaults in the theme instead of duplicating them in this site.
[project.theme]
name = "molcrafts"
language = "en"

# molq accent (rose) for links, hovers, and hero eyebrows.
[project.extra.molcrafts]
product = "molq"
accent = "#db2777"                        # primary (主) — molq signature colour
accent_soft = "rgba(219, 39, 119, 0.14)"  # secondary (副) — soft fill behind it

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MolCrafts/molq"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/molcrafts-molq/"

[project.plugins.search]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_root_full_path = false
separate_signature = true
heading_level = 2
merge_init_into_class = true
members_order = "source"
filters = ["!^_"]
