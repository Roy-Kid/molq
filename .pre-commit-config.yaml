# Mirrors every check in .github/workflows/ci.yml. Any divergence is a bug —
# when you add/modify a CI step, update this file in the same commit.
#
# CI source of truth: .github/workflows/ci.yml
#   Lint job:
#     - ruff format --check src tests   → ruff-format (pre-commit stage)
#     - ruff check src tests            → ruff (pre-commit stage; --fix locally)
#     - pre-commit run --all-files      → this file (hygiene + ty)
#   Test job:
#     - pytest -q --cov=molq …          → pytest (pre-push stage)
#
# Stages:
#   - pre-commit: fast static checks (must stay green for `pre-commit run --all-files`)
#   - pre-push:   full test suite (slow; matches the CI test job)

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(mkdocs\.yml|docs/)
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      # Matches CI "ruff check src tests"; --fix keeps the working tree clean
      # so commit-time fails match CI without a second manual pass.
      - id: ruff
        args: [--fix]
      # Matches CI "ruff format --check src tests"
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty check src/ (CI via pre-commit)
        entry: ty check src/
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest -q (CI Test job)
        entry: pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
