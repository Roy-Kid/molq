# Single source of truth with .github/workflows/ci.yml Lint job.
# CI runs ONLY: pip install -e ".[dev]" + pre-commit + pre-commit run --all-files
# Local hooks use language: system so they invoke the same ruff/ty/pytest from
# the project env (pinned in pyproject.toml [project.optional-dependencies] dev).
# Never pin a second ruff via ruff-pre-commit — that was the drift source.
#
# Stages:
#   pre-commit — hygiene + ruff + ty  (what CI Lint runs)
#   pre-push   — full pytest (what CI Test runs; cov optional locally)

default_install_hook_types: [pre-commit, pre-push]
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(mkdocs\.yml|docs/)
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      # Same binary as CI: `ruff`/`ty` from pip install -e ".[dev]" (pinned).
      # always_run: match CI `pre-commit run --all-files` even when the
      # commit only touches yaml/toml/docs.
      - id: ruff-check
        name: ruff check src tests (CI Lint)
        entry: ruff check src tests
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format --check src tests (CI Lint)
        entry: ruff format --check src tests
        language: system
        pass_filenames: false
        always_run: true

      - id: ty
        name: ty check src/ (CI Lint)
        entry: ty check src/
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest -q --cov=molq (CI Test)
        entry: pytest -q --cov=molq --cov-report=term-missing
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
