concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}
name: ci

'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - dev
    - master
    - main
  workflow_call: null

env:
  UV_NO_SOURCES: "true"
  CGO_ENABLED: "0"

jobs:
  context:
    permissions:
      contents: read
    name: ci / context
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@master

  docs:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: ci / Manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra docs
      - run: uv run --extra docs zensical build --strict

  lint:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: ci / Contract, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: npm --prefix sdk/typescript ci
      - run: uv run python tools/check_generated.py
      - run: |
          uv run ruff check src tests tools examples
          uv run ruff format --check src tests tools examples
          uv run ty check src/

  go:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: ci / Go serve on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Check concurrent runtime operations
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  test:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: ci / Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["3.12", "3.13"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Build the current platform serve executable
        run: |
          mkdir -p src/molq/_bin
          go build -o src/molq/_bin/molq ./cmd/molq
      - run: uv sync --extra dev
      - run: uv run pytest -q --cov=molq --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  windows:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: ci / Windows remote control plane
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Compile the Windows serve executable and tests
        run: |
          New-Item -ItemType Directory -Force src/molq/_bin | Out-Null
          go build -o src/molq/_bin/molq.exe ./cmd/molq
          go test ./... -run '^$'
      - run: uv sync --extra dev
      - run: uv run pytest -q tests/v09/test_control_plane.py tests/v09/test_contract.py tests/v09/test_wire.py -k "not no_service"

  typescript:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: ci / Native TypeScript peer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Build the current platform serve executable
        run: |
          mkdir -p src/molq/_bin
          go build -o src/molq/_bin/molq ./cmd/molq
      - run: uv sync --extra dev
      - run: npm --prefix sdk/typescript ci
      - run: npm --prefix sdk/typescript test
        env:
          MOLQ_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - run: npm pack --dry-run
        working-directory: sdk/typescript

  package:
    if: needs.context.outputs.skip-pr != 'true'
    needs:
    - context
    name: ci / Installed artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: |
          python -m venv /tmp/molq-wheel
          /tmp/molq-wheel/bin/pip install dist/*.whl
      - name: Check wheel outside checkout
        working-directory: /tmp
        run: /tmp/molq-wheel/bin/python "${{ github.workspace }}/tools/check_wheel.py"
      - name: Check installed console
        working-directory: /tmp
        run: |
          /tmp/molq-wheel/bin/molq --version
          /tmp/molq-wheel/bin/molq --help

  workflow-policy:
    name: ci / workflows
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - uses: MolCrafts/molcrafts-ci/actions/check-workflows@master
