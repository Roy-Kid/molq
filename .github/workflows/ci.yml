name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_call:

jobs:
  lint:
    name: Contract, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: npm --prefix sdk/typescript ci
      - run: uv run python tools/check_generated.py
      - run: |
          uv run ruff check src tests tools examples
          uv run ruff format --check src tests tools examples
          uv run ty check src/

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run pytest -q --cov=molq --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  windows:
    name: Windows remote control plane
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run pytest -q tests/v09/test_control_plane.py tests/v09/test_contract.py -k "not no_service"

  typescript:
    name: Native TypeScript peer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: npm --prefix sdk/typescript ci
      - run: npm --prefix sdk/typescript test
        env:
          MOLQ_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - run: npm pack --dry-run
        working-directory: sdk/typescript

  package:
    name: Installed artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: |
          python -m venv /tmp/molq-wheel
          /tmp/molq-wheel/bin/pip install dist/*.whl
      - name: Check wheel outside checkout
        working-directory: /tmp
        run: /tmp/molq-wheel/bin/python "${{ github.workspace }}/tools/check_wheel.py"
      - name: Check installed console
        working-directory: /tmp
        run: |
          /tmp/molq-wheel/bin/molq --version
          /tmp/molq-wheel/bin/molq --help
